[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roundtable"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "click>=8",
    "tomli-w>=1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
roundtable = "roundtable.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/roundtable"]

[tool.poe]
include = "poe_tasks.toml"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-bdd",
    "pytest-testmon",
    "poethepoet",
    "httpx>=0.27",
]
