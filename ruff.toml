target-version = "py312"
line-length = 100
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "UP", "B", "D"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/**" = ["D"]

[lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[format]
quote-style = "double"
indent-style = "space"
